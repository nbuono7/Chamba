<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChamBA — Restablecer contraseña</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #E2662D; --teal-dark: #B84F1F; --teal-light: #FBE9DC; --teal-mid: #F0955F;
      --bg: #F7F2E7; --card: #fff; --text: #1E2430; --text-mid: #555; --text-soft: #999; --border: #e5e7eb;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 0 5%; height: 64px; background: #fff; border-bottom: 1px solid var(--border); }
    .nav-logo { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 800; text-decoration: none; color: var(--text); }
    .nav-logo span { color: var(--teal); }

    .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 36px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(22,35,63,0.1); }
    .title { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { font-size: 14px; color: var(--text-mid); margin-bottom: 24px; line-height: 1.5; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-mid); margin-bottom: 5px; }
    .form-group input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; font-size: 14px; font-family: inherit; color: var(--text); background: #fff; transition: border-color 0.15s; }
    .form-group input:focus { outline: none; border-color: var(--teal); }
    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 42px; }
    .pass-toggle { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; padding: 6px 8px; opacity: 0.6; }
    .pass-toggle:hover { opacity: 1; }

    .req-list { list-style: none; margin: 8px 0 4px; display: flex; flex-direction: column; gap: 3px; }
    .req-list li { font-size: 12px; color: var(--text-soft); display: flex; align-items: center; gap: 6px; }
    .req-list li.ok { color: #1a8f5e; }
    .req-list li .mark { width: 14px; text-align: center; }

    .btn-submit { width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; margin-top: 8px; transition: background 0.15s; }
    .btn-submit:hover { background: var(--teal-dark); }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

    .error-box { background: #fdeaea; border: 1px solid #f09595; border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #a32d2d; margin-bottom: 16px; display: none; }
    .success-box { text-align: center; display: none; }
    .success-icon { font-size: 40px; margin-bottom: 12px; }
    .btn-link { display: inline-block; margin-top: 16px; background: var(--teal); color: #fff; text-decoration: none; padding: 11px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">Cham<span>BA</span></a>
</nav>
<div class="page">
  <div class="card">

    <div id="form-card">
      <div class="title">Restablecer contraseña</div>
      <div class="sub">Elegí una contraseña nueva para tu cuenta.</div>
      <div class="error-box" id="error-box"></div>

      <div class="form-group">
        <label>Contraseña nueva</label>
        <div class="pass-wrap">
          <input type="password" id="f-pass1" placeholder="••••••••" oninput="chequearRequisitos()"/>
          <button type="button" class="pass-toggle" onclick="togglePass('f-pass1', this)" aria-label="Mostrar contraseña">👁️</button>
        </div>
      </div>
      <ul class="req-list" id="req-list">
        <li id="req-len"><span class="mark">○</span> Más de 6 caracteres</li>
        <li id="req-letra"><span class="mark">○</span> Al menos una letra</li>
        <li id="req-num"><span class="mark">○</span> Al menos un número</li>
        <li id="req-sim"><span class="mark">○</span> Al menos un símbolo (!@#$%...)</li>
      </ul>

      <div class="form-group" style="margin-top:14px">
        <label>Repetí la contraseña nueva</label>
        <div class="pass-wrap">
          <input type="password" id="f-pass2" placeholder="••••••••" onkeydown="if(event.key==='Enter')enviar()"/>
          <button type="button" class="pass-toggle" onclick="togglePass('f-pass2', this)" aria-label="Mostrar contraseña">👁️</button>
        </div>
      </div>

      <button class="btn-submit" id="btn-submit" onclick="enviar()">Cambiar contraseña</button>
    </div>

    <div class="success-box" id="success-box">
      <div class="success-icon">✅</div>
      <div class="title">¡Listo!</div>
      <div class="sub">Tu contraseña se actualizó correctamente.</div>
      <a class="btn-link" href="/login">Ir a iniciar sesión</a>
    </div>

  </div>
</div>

<script>
const BACKEND = 'https://chamba-backend-vurx.onrender.com';
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

window.onload = () => {
  if (!token) {
    document.getElementById('form-card').innerHTML = `
      <div class="title">Link inválido</div>
      <div class="sub">Este link no tiene la información necesaria para restablecer tu contraseña. Pedí uno nuevo desde la pantalla de inicio de sesión.</div>
      <a class="btn-link" href="/login">Volver a iniciar sesión</a>`;
  }
};

function togglePass(id, btn) {
  const input = document.getElementById(id);
  const visible = input.type === 'text';
  input.type = visible ? 'password' : 'text';
  btn.textContent = visible ? '👁️' : '🙈';
}

function chequearRequisitos() {
  const pass = document.getElementById('f-pass1').value;
  marcar('req-len', pass.length > 6);
  marcar('req-letra', /[A-Za-z]/.test(pass));
  marcar('req-num', /[0-9]/.test(pass));
  marcar('req-sim', /[^A-Za-z0-9]/.test(pass));
}

function marcar(id, cumple) {
  const li = document.getElementById(id);
  li.classList.toggle('ok', cumple);
  li.querySelector('.mark').textContent = cumple ? '✓' : '○';
}

function validarPassword(pass) {
  if (!pass || pass.length <= 6) return 'La contraseña tiene que tener más de 6 caracteres.';
  if (!/[A-Za-z]/.test(pass)) return 'La contraseña tiene que incluir al menos una letra.';
  if (!/[0-9]/.test(pass)) return 'La contraseña tiene que incluir al menos un número.';
  if (!/[^A-Za-z0-9]/.test(pass)) return 'La contraseña tiene que incluir al menos un símbolo (ej: !@#$%&).';
  return null;
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}

async function enviar() {
  document.getElementById('error-box').style.display = 'none';
  const pass1 = document.getElementById('f-pass1').value;
  const pass2 = document.getElementById('f-pass2').value;

  const errorFuerza = validarPassword(pass1);
  if (errorFuerza) return showError(errorFuerza);
  if (pass1 !== pass2) return showError('Las dos contraseñas no coinciden.');

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    const r = await fetch(`${BACKEND}/api/usuarios/restablecer-password`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pass1 })
    });
    const data = await r.json();
    if (!r.ok) {
      btn.disabled = false; btn.textContent = 'Cambiar contraseña';
      return showError(data.error || 'No se pudo cambiar la contraseña.');
    }
    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-box').style.display = 'block';
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Cambiar contraseña';
    showError('No se pudo conectar. Intentá de nuevo.');
  }
}
</script>
</body>
</html>
